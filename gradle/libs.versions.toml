# Pinned versions only. Upgrades are their own milestone with the golden corpus re-run
# (CLAUDE.md, "Repository conventions"). Every pin below was verified against upstream on
# 2026-08-17 and exercised by the Phase 0 spikes — see docs/feasibility/phase0-report.md.

[versions]
# AGP 9.2.0, not 9.4.x: Chaquopy 17.0.0 documents support for AGP 7.3-9.2 (finding C9),
# and 17.0.0 is the newest Chaquopy. 9.4.0 was tried on 2026-09-03 and *works* -- it
# configures, it assembles every Python task, and 31 engine tests including the on-device
# golden corpus pass against it. It is still not taken: "builds and passes" is not the same
# as "supported" for the component that packages CPython into the APK, and the failure mode
# of an undocumented pairing is a subtle packaging bug in an accounting app rather than a
# red build. Raise this when Chaquopy documents the wider range.
agp = "9.2.0"
kotlin = "2.4.21"
# Current AndroidX and Compose require compileSdk 37. The SDK package is named
# "platforms;android-37.0", not "platforms;android-37" - see docs/feasibility/m1.md.
composeBom = "2026.08.00"
# Material 3 is pinned above the BOM (which carries 1.4.0) for the Expressive components --
# MaterialExpressiveTheme, MotionScheme, ButtonGroup, LoadingIndicator, MaterialShapes --
# none of which 1.4.0 contains (docs/material-expressive.md). Apache-2.0 AndroidX like the
# rest of Compose. 1.5.0-beta01 asks for Compose foundation/ui 1.12.0, which is exactly what
# the BOM above already resolves, so nothing else moves; it adds one transitive AndroidX
# module, androidx.graphics:graphics-shapes 1.0.1 (Apache-2.0), for the shape morphs.
# Return to the BOM's version when a stable BOM carries 1.5.0.
material3 = "1.5.0-beta01"
chaquopy = "17.0.0"
# detekt for Kotlin static analysis (N2). Apache-2.0, which is fine here in a way it would
# not be for a shipped dependency: it runs at build time and no part of it is linked into
# the app, exactly like AGP and Gradle themselves (docs/architecture.md 7.1).
detekt = "1.23.8"
python = "3.13"

compileSdk = "37"
targetSdk = "36"
# 29, not 28: on API 28 the engine cannot start at all. Chaquopy's libpython3.13.so
# calls the legacy `open()` syscall from a static constructor, and Android's seccomp
# filter kills the process with SIGSYS before Python is up. Measured on API 28, 29, 30
# and 36 — 28 is the only one that fails (docs/milestones/m14-part17.md).
minSdk = "29"

activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
documentFile = "1.1.0"
# CameraX for receipt capture (M8). Apache-2.0, like the rest of AndroidX: the engine runs
# in its own process, which is what keeps that compatible with a GPL-2.0-only app
# (docs/architecture.md 7.1). 1.5.0 -> 1.6.2 on 2026-09-03, the current stable.
camerax = "1.6.2"
# Zoom and pan for documents and pages (B84). Apache-2.0 (me.saket.telephoto). 1.0 is in
# alpha on 2026-09-14, so the last stable release is pinned.
telephoto = "0.19.0"
# Drag to reorder scanned pages in a lazy row (B84). Apache-2.0 (sh.calvin.reorderable).
reorderable = "3.1.0"
# WorkManager for scheduled backups (M9). Apache-2.0, like the rest of AndroidX.
# 2.11.0 -> 2.11.2 on 2026-09-03, a patch release on the same minor.
work = "2.11.2"
# Argon2id for backup encryption (M9). Apache-2.0, ~1 MB of native code across both ABIs —
# Bouncy Castle would have been ~8 MB for the same one function.
argon2kt = "1.6.0"
junit = "4.13.2"
kotlinxCoroutines = "1.11.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
# UI Automator, to drive the system document picker in one test (V14). Test-only and
# Apache-2.0, so it raises no GPL-2.0-only question for the same reason espresso and
# compose-ui-test do not: it is never linked into a shipped APK.
uiautomator = "2.4.0"


# OpenCV, for document edge detection and perspective correction (B45).
#
# Apache-2.0. Permitted here for the reason architecture.md 7.1 already gives for AndroidX:
# the GPL-2.0-only code -- Beancount, Fava, CPython -- runs in the `:engine` process and this
# never touches it. It is bundled rather than fetched, so D1/D3 are untouched and both
# editions get the scanner.
#
# Size, measured from the published AAR rather than estimated: 117.7 MB across four ABIs, of
# which arm64-v8a is 24.8 MB and x86_64 57.1 MB of `.so`. Only those two are built. Trimming
# to core+imgproc is recorded as D10, not done.
opencv = "4.12.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentFile" }

camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
telephoto-zoomable = { module = "me.saket.telephoto:zoomable", version.ref = "telephoto" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version.ref = "argon2kt" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

opencv = { module = "org.opencv:opencv", version.ref = "opencv" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
# Test-only, and Apache-2.0: never linked into a shipped APK, so it raises no
# GPL-2.0-only question (docs/architecture.md 7.1).
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# NOTE: org.jetbrains.kotlin.android must NOT be applied — AGP 9 has built-in Kotlin
# support and fails the build if it is present (finding C9). This is for JVM-only modules.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
chaquopy = { id = "com.chaquo.python", version.ref = "chaquopy" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
