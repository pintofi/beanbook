# Pinned versions only. Upgrades are their own milestone with the golden corpus re-run
# (CLAUDE.md, "Repository conventions"). Every pin below was verified against upstream on
# 2026-08-17 and exercised by the Phase 0 spikes — see docs/feasibility/phase0-report.md.

[versions]
# AGP 9.2.0, not 9.3.x: Chaquopy 17.0.0 documents support for AGP 7.3-9.2 (finding C9).
agp = "9.2.0"
kotlin = "2.4.10"
# Current AndroidX and Compose require compileSdk 37. The SDK package is named
# "platforms;android-37.0", not "platforms;android-37" - see docs/feasibility/m1.md.
composeBom = "2026.08.00"
chaquopy = "17.0.0"
# detekt for Kotlin static analysis (N2). Apache-2.0, which is fine here in a way it would
# not be for a shipped dependency: it runs at build time and no part of it is linked into
# the app, exactly like AGP and Gradle themselves (docs/architecture.md 7.1).
detekt = "1.23.8"
python = "3.13"

compileSdk = "37"
targetSdk = "36"
# 29, not 28: on API 28 the engine cannot start at all. Chaquopy's libpython3.13.so
# calls the legacy `open()` syscall from a static constructor, and Android's seccomp
# filter kills the process with SIGSYS before Python is up. Measured on API 28, 29, 30
# and 36 — 28 is the only one that fails (docs/milestones/m14-part17.md).
minSdk = "29"

activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
documentFile = "1.1.0"
# CameraX for receipt capture (M8). Apache-2.0, like the rest of AndroidX: the engine runs
# in its own process, which is what keeps that compatible with a GPL-2.0-only app
# (docs/architecture.md 7.1).
camerax = "1.5.0"
# WorkManager for scheduled backups (M9). Apache-2.0, like the rest of AndroidX.
work = "2.11.0"
# Argon2id for backup encryption (M9). Apache-2.0, ~1 MB of native code across both ABIs —
# Bouncy Castle would have been ~8 MB for the same one function.
argon2kt = "1.6.0"
junit = "4.13.2"
kotlinxCoroutines = "1.11.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
# Ed25519 for offline key verification. The platform only gained Ed25519 in API 33 and
# minSdk is 28, so it cannot come from java.security.
eddsa = "0.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentFile" }

camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
argon2kt = { module = "com.lambdapioneer.argon2kt:argon2kt", version.ref = "argon2kt" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# net.i2p.crypto:eddsa is public domain (CC0 1.0), so it raises no GPL-2.0-only question,
# and it is ~90 KB rather than the several megabytes a full provider would add.
eddsa = { module = "net.i2p.crypto:eddsa", version.ref = "eddsa" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
# Test-only, and Apache-2.0: never linked into a shipped APK, so it raises no
# GPL-2.0-only question (docs/architecture.md 7.1).
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# NOTE: org.jetbrains.kotlin.android must NOT be applied — AGP 9 has built-in Kotlin
# support and fails the build if it is present (finding C9). This is for JVM-only modules.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
chaquopy = { id = "com.chaquo.python", version.ref = "chaquopy" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
