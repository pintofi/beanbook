# Pinned versions only. Upgrades are their own milestone with the golden corpus re-run
# (CLAUDE.md, "Repository conventions"). Every pin below was verified against upstream on
# 2026-08-17 and exercised by the Phase 0 spikes — see docs/feasibility/phase0-report.md.

[versions]
# AGP 9.2.0, not 9.3.x: Chaquopy 17.0.0 documents support for AGP 7.3-9.2 (finding C9).
agp = "9.2.0"
kotlin = "2.4.10"
# Current AndroidX and Compose require compileSdk 37. The SDK package is named
# "platforms;android-37.0", not "platforms;android-37" - see docs/feasibility/m1.md.
composeBom = "2026.08.00"
chaquopy = "17.0.0"
python = "3.13"

compileSdk = "37"
targetSdk = "36"
minSdk = "28"

activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
documentFile = "1.1.0"
junit = "4.13.2"
kotlinxCoroutines = "1.11.0"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentFile" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# NOTE: org.jetbrains.kotlin.android must NOT be applied — AGP 9 has built-in Kotlin
# support and fails the build if it is present (finding C9). This is for JVM-only modules.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
chaquopy = { id = "com.chaquo.python", version.ref = "chaquopy" }
