# Dependabot: a notifier, not an upgrader.
#
# CLAUDE.md makes upgrades their own milestone with the golden corpus re-run, so nothing
# here may auto-merge. What Dependabot is good for in this repository is answering the
# question "has anything moved?" without a person running maven-metadata queries by hand.
#
# Every PR it opens still needs the same two things a manual bump needs: a licence check
# (the app is GPL-2.0-only, Apache-2.0 is fine only for build-time and AndroidX runtime
# pieces, and GPLv3 is never acceptable — docs/architecture.md 7.1), and the gates in
# CLAUDE.md's "Definition of done".

version: 2
updates:
  # Kotlin/Android dependencies, read from gradle/libs.versions.toml. Dependabot does
  # understand the version catalog, which is where every pin in this project lives.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "needs-licence-check"]
    # One PR for the AndroidX families rather than one per artifact: camera-core and
    # camera-camera2 share a version and must move together, and five separate PRs that
    # each half-update a family are worse than one that updates it.
    groups:
      androidx:
        patterns: ["androidx.*"]
      compose:
        patterns: ["androidx.compose*"]
      test:
        patterns: ["*junit*", "*espresso*", "*test*"]
        dependency-type: development
    ignore:
      # AGP is capped by Chaquopy, not by what is newest. Chaquopy 17.0.0 documents
      # support for AGP 7.3-9.2; 9.4.0 was tried on 2026-09-03 and does build, but
      # "builds" is not "supported" for the component that packages CPython into the
      # APK. Raise this deliberately when Chaquopy documents a wider range.
      - dependency-name: "com.android.tools.build:gradle"
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      # Compose Material3 must track the BOM. A standalone bump here would silently
      # override the BOM's pin and could drag in an alpha: 1.5.0 exists only as
      # alpha27, and the decision on record is to wait for stable (B23).
      - dependency-name: "androidx.compose.material3:material3"

  # Workflow actions. These are the supply chain that builds and signs the release, so
  # they matter as much as anything compiled in.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]

# Deliberately NOT configured: the pip ecosystem.
#
# engine-local/requirements.lock is generated by tools/lock-python.py from a built APK and
# is hash-pinned for --require-hashes, and requirements-local.lock holds hashes for two
# wheels cross-built per machine. Dependabot editing either by hand would produce a lock
# that does not match the APK it claims to describe, and would break the documented
# regeneration path. Python upgrades stay manual, with the corpus re-run.
