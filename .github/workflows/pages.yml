# Publishes site/ to GitHub Pages.
#
# The site is in this repository rather than a separate one so the privacy policy and the
# app it describes move together: a release that changes what the app does with the network
# changes the page in the same commit, and a reviewer can see that it did.
#
# Pages serves this as a project site at https://<owner>.github.io/<repo>/. A GitHub Free
# account can have one such site per repository, so this costs nothing and takes nothing
# away from any other page.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer commit win rather than queueing behind an older
# one. Not cancel-in-progress on the deploy itself, which would leave Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Guard against a dead payment link, not against the maintainer note beside it.
      #
      # An earlier version of this step failed the whole deploy whenever site/ contained an
      # OWNER comment, which would have blocked the *privacy policy* -- the one page Google
      # Play requires by URL -- because of an unrelated placeholder on the support page. The
      # pages are written to be publishable before the Ko-fi page exists: support.html says
      # plainly that it is not open yet, which is true and useful. What must never ship is a
      # link that looks real and goes nowhere.
      - name: Refuse to publish a dead payment link
        run: |
          if grep -rnE 'href="(#|)(TODO|PLACEHOLDER|CHANGEME|example\.com)' site/; then
            echo "::error::site/ contains a placeholder link; give it a real URL or remove it."
            exit 1
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
