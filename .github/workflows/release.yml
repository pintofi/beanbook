# Builds and publishes a release, on a tag.
#
# The APKs are signed here with the project key, which is held as repository secrets
# (BCA_KEYSTORE_BASE64 and friends). A key CI can use is a key anyone who can change a workflow
# file can use, so this file, the actions it runs (pinned to commit hashes) and the main
# branch are what to protect. The workflow publishes a draft release and its checksums;
# a person reads them and publishes the release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read by default. Only the job that publishes the draft release is given write access.
permissions:
  contents: read

jobs:
  verify:
    # A tag does not get to skip the gates. Everything that guards a normal push guards a
    # release, and the release job does not start until it has passed.
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    # Signed APKs come from a tag and from nothing else. A manual run started on a branch
    # would otherwise sign and draft a release named after the branch.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-wheels
          path: wheels

      - name: The tag names the version being built
        # `v1.2.3` must be the versionName in app/build.gradle.kts, or the published files
        # would carry one number in their names and another inside the APK.
        run: |
          declared="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)"
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $declared in app/build.gradle.kts"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches versionName $declared"

      - name: Reproducible Python bytecode
        # Hash-based .pyc rather than timestamp-based, so two builds of the same commit are
        # byte-identical. Derived from the commit, so a different commit is still allowed to
        # differ.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Take the wheels the verify run built
        # Not rebuilt here: a release must ship the artefacts the gates actually passed on,
        # and the wheels are not reproducible byte for byte. The pins for them are generated
        # rather than committed, so this job writes its own from what it got — it is a
        # separate checkout from the job that built them.
        run: |
          WHEELS="$GITHUB_WORKSPACE/wheels"
          if [ -z "$(ls -A "$WHEELS"/*.whl 2>/dev/null)" ]; then
            echo "::error::no Android wheels at $WHEELS; the verify run should have built them"
            exit 1
          fi
          ls "$WHEELS"
          python3 tools/lock-python.py --refresh-local --wheel-dir "$WHEELS"
          echo "BCA_WHEEL_DIR=$WHEELS" >> "$GITHUB_ENV"

      - name: Restore the signing key
        # Absent secrets produce an unsigned build rather than a failing one, and the step
        # below says which happened. A release that is quietly unsigned must be obvious.
        env:
          KEYSTORE_BASE64: ${{ secrets.BCA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::no signing key configured; this build will be UNSIGNED"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BCA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build both editions
        env:
          BCA_KEYSTORE_PASSWORD: ${{ secrets.BCA_KEYSTORE_PASSWORD }}
          BCA_KEY_ALIAS: ${{ secrets.BCA_KEY_ALIAS }}
          BCA_KEY_PASSWORD: ${{ secrets.BCA_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleExpertRelease :app:assemblePlayRelease
          -Pbeancount.wheelDir="$BCA_WHEEL_DIR"

      - name: Refuse to publish an unsigned release
        run: |
          if ls app/build/outputs/apk/*/release/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::unsigned APKs present — the signing secrets are missing or wrong"
            ls app/build/outputs/apk/*/release/*-unsigned.apk
            exit 1
          fi
          echo "every release APK is signed"

      - name: Each APK carries its own version code
        # F-Droid and Android treat the per-ABI files as separate builds, so two of them with
        # the same versionCode would make one unreachable. app/build.gradle.kts derives them
        # as release number * 10 + an ABI suffix; this checks what the APKs actually say.
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          release="$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts | head -1)"
          for pair in universal:0 arm64-v8a:1 x86_64:2; do
            abi="${pair%%:*}"; want=$((release * 10 + ${pair##*:}))
            got="$("$AAPT2" dump badging "app/build/outputs/apk/expert/release/app-expert-$abi-release.apk" | sed -n "s/^package:.* versionCode='\([0-9]*\)'.*/\1/p")"
            echo "$abi: versionCode $got (expected $want)"
            test "$got" = "$want"
          done

      - name: Name the files and write their checksums
        # Files are published as beanbook-<version>-<abi>.apk, copied out of Gradle's
        # per-flavour folders. Only the Expert edition is published here (it is also what F-Droid verifies
        # against); Play ships through Play. The checksums file lists exactly these names and nothing else.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir dist
          for abi in arm64-v8a x86_64 universal; do
            cp "app/build/outputs/apk/expert/release/app-expert-$abi-release.apk" "dist/beanbook-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum beanbook-*.apk) | tee checksums.txt
          test -s checksums.txt

      - name: Write the release notes
        # The changes come from the version's section in CHANGELOG.md, and the rest from
        # .github/release-notes-template.md. The step fails if the section is missing or empty, so a
        # release is never drafted with nothing but checksums.
        run: python3 -I tools/release-notes.py "${GITHUB_REF_NAME#v}" checksums.txt > release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.apk
            checksums.txt
          body_path: release-notes.md
          draft: true
          fail_on_unmatched_files: true
