# Builds and publishes a release, on a tag.
#
# What this does NOT do is sign the update manifest. That needs the Ed25519 private key, and
# a key CI can use is a key anyone who can change a workflow file can use. CI publishes the
# artifacts and their checksums; a person issues the manifest offline with `issue-update.sh`
# and attaches it afterwards (docs/release-checklist.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    # A tag does not get to skip the gates. Everything that guards a normal push guards a
    # release, and the release job does not start until it has passed.
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore the signing key
        # Absent secrets produce an unsigned build rather than a failing one, and the step
        # below says which happened. A release that is quietly unsigned must be obvious.
        env:
          KEYSTORE_BASE64: ${{ secrets.BCA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::no signing key configured; this build will be UNSIGNED"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BCA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build both editions
        env:
          BCA_KEYSTORE_PASSWORD: ${{ secrets.BCA_KEYSTORE_PASSWORD }}
          BCA_KEY_ALIAS: ${{ secrets.BCA_KEY_ALIAS }}
          BCA_KEY_PASSWORD: ${{ secrets.BCA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleExpertRelease :app:assemblePlayRelease

      - name: Refuse to publish an unsigned release
        run: |
          if ls app/build/outputs/apk/*/release/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::unsigned APKs present — the signing secrets are missing or wrong"
            ls app/build/outputs/apk/*/release/*-unsigned.apk
            exit 1
          fi
          echo "every release APK is signed"

      - name: Checksums
        # These are what the update manifest is issued against, so they go in the log and in
        # the release body rather than being recomputed by hand later.
        run: ./gradlew :app:releaseChecksums | tee checksums.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/expert/release/*.apk
            checksums.txt
          body_path: checksums.txt
          draft: true
          fail_on_unmatched_files: true
