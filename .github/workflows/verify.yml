name: verify

# The M1 gate. Every check here must pass before a change lands.
# Instrumentation, corpus and accessibility gates are added by the milestones that
# introduce them (PLAN.md, "Test strategy") — this file grows with the app rather than
# listing jobs that do not exist yet.

on:
  # Callable so a release runs exactly the same gates as a push.
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Kotlin unit tests + boundary gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13 for Chaquopy's pip
        # Chaquopy needs a host interpreter matching the embedded runtime's minor version
        # (Phase 0 finding).
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        # Every module with tests, not two of them. This ran :core-domain and
        # :core-engine only, so :core-data, :core-entitlement and :engine-remote — 242
        # tests between them — were never going to run in CI even once the workflow
        # could be loaded at all.
        run: >-
          ./gradlew :core-domain:test :core-data:test :core-engine:test
          :core-entitlement:test :engine-remote:test

      - name: detekt
        # Static analysis across every module. It earned its place on the first run: an
        # accessibility helper written in M6 and never wired up, so every amount was
        # announced as raw text (docs/milestones/m14-part16.md).
        run: ./gradlew detekt

      - name: Play flavor boundaries
        run: ./gradlew :app:verifyPlayFlavorBoundaries

  workflows:
    name: Workflows are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every workflow parses and has runnable jobs
        # verify.yml was malformed from the day it was written and nobody noticed for
        # thirteen milestones: GitHub never loaded it, so none of these gates ever ran.
        # A gate that has never executed is not a gate.
        run: |
          pip install --quiet pyyaml
          python3 tools/check-workflows.py

  secrets:
    name: Secret and TLS-bypass scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No trustAll TLS anywhere in the repository
        # CLAUDE.md, non-negotiable: certificate errors are fatal and no trustAll code may
        # exist in this repository.
        run: |
          if grep -rnE 'trustAll|TrustAllCerts|ALLOW_ALL_HOSTNAME|checkServerTrusted\s*\([^)]*\)\s*\{\s*\}' \
              --include='*.kt' --include='*.java' --include='*.py' . ; then
            echo "::error::TLS verification bypass found"
            exit 1
          fi
          echo "no TLS bypass found"

      - name: No silent downgrade from https to cleartext
        # Cleartext is allowed in remote mode, but only when the user typed http:// in full.
        # A scheme rewrite anywhere in the transport or client would turn "https" into a
        # suggestion, and it would look like ordinary string handling in review
        # (docs/threat-model.md 3.5).
        run: |
          if grep -rnE '"https".*(replace|removePrefix).*"http"|replace\(\s*"https"|"http://" *\+ *(host|origin|address)' \
              --include='*.kt' engine-remote/src/main app/src/main ; then
            echo "::error::something rewrites an https address into a cleartext one"
            exit 1
          fi
          echo "no scheme downgrade found"

      - name: No way past a certificate error in the WebView
        # onReceivedSslError must cancel, never proceed. A single proceed() call there is a
        # working "accept anyway" button, and it looks like ordinary error handling in review
        # (CLAUDE.md, security rules).
        run: |
          if grep -rn -A20 'onReceivedSslError' --include='*.kt' . | grep -E 'handler\.proceed|\bproceed\(\)' ; then
            echo "::error::an SSL error handler proceeds past a bad certificate"
            exit 1
          fi
          echo "no SSL error is proceeded past"

      - name: No escaped string templates in user-facing text
        # "${'$'}{value}" prints the template literally instead of interpolating it. It has
        # shipped twice in this app — a key banner and three save messages — and is invisible
        # until the exact state that renders it occurs (docs/milestones/m7.md, m8.md).
        run: |
          if git grep -nF -- "\${'\$'}" -- '*.kt' ; then
            echo "::error::escaped string template found; it will print literally"
            exit 1
          fi
          echo "no escaped string templates"

      - name: Every Python pin carries a hash
        # pip enforces this during the build, but only for the packages it reaches. A pin
        # that loses its hash lines in a hand-edit would quietly leave --require-hashes
        # mode for the whole file, and nothing would say so (docs/milestones/m14-part9.md).
        run: |
          python3 - <<'CHECK'
          import re, sys
          text = open("engine-local/requirements.lock").read()
          pins = re.findall(r"^([A-Za-z0-9_.\-]+)==(\S+?)( \\)?$", text, re.M)
          bare = [n for n, _, cont in pins if not cont]
          if bare:
              print("::error::pins with no hash:", ", ".join(bare)); sys.exit(1)
          print(f"{len(pins)} pins, all hashed, {text.count('--hash=sha256:')} digests")
          CHECK

      - name: The licence is present and is GPL-2.0-only
        # The repository declared itself GPL-2.0-only in CLAUDE.md for thirteen milestones
        # and shipped no licence text at all (docs/milestones/m14-part11.md). GPLv3 is
        # named here because Beancount is explicitly "not or later": a v3 text would not be
        # a formatting slip, it would be a licence this project cannot use.
        run: |
          if [ ! -s COPYING ]; then
            echo "::error::COPYING is missing; the app claims to be GPL-2.0-only"
            exit 1
          fi
          if ! grep -q "Version 2, June 1991" COPYING; then
            echo "::error::COPYING is not the GPL version 2 text"
            exit 1
          fi
          if grep -qE "Version 3, 29 June 2007|GNU GENERAL PUBLIC LICENSE.*Version 3" COPYING; then
            echo "::error::COPYING is GPLv3; Beancount is GPL-2.0-only, explicitly not or-later"
            exit 1
          fi
          echo "COPYING is the GPL version 2 text"

      - name: No hard-coded signing keys
        run: |
          if git ls-files | grep -E '\.(pem|jks|keystore|p12|der)$'; then
            echo "::error::key material committed to the repository"
            exit 1
          fi
          # The contribution-key signing key lives in the private issuance repo and must
          # never be pasted into a source file here (docs/distribution.md 4.6).
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY' -- . ; then
            echo "::error::a private key is embedded in a tracked file"
            exit 1
          fi
          echo "no key material committed"

  wheels:
    name: Cross-build the Android wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache the built wheels
        # Keyed on what determines their content: the sdist pins, the backend pins and the
        # build script. Change any of the three and they are rebuilt; change nothing and a
        # runner spends no time on the NDK download.
        id: cache
        uses: actions/cache@v4
        with:
          path: wheels
          key: android-wheels-${{ hashFiles('engine-local/wheels.lock', 'engine-local/build-backends.lock', 'tools/build-wheels.sh') }}

      - name: Android SDK command-line tools
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Rust with the Android targets
        if: steps.cache.outputs.cache-hit != 'true'
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-wheels.sh --out wheels

      - name: No build-machine paths in the wheels
        # The August wheels carried the maintainer's home directory in 25 strings, from
        # Rust panic metadata and maturin's SBOM (docs/milestones/m14-part8.md).
        run: python3 tools/check-build-paths.py wheels/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: android-wheels
          path: wheels/*.whl
          retention-days: 7

  build:
    name: Build both editions
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-wheels
          path: wheels

      - name: Check the wheels are here
        # Until M14 this step echoed a TODO and exited 0, so the build failed two steps
        # later with a confusing error instead of here with a clear one. beancount and
        # watchfiles have no upstream Android wheels: without them nothing assembles.
        run: |
          WHEELS="${BCA_WHEEL_DIR:-${GITHUB_WORKSPACE:-$PWD}/wheels}"
          if [ -z "$(ls -A "$WHEELS"/*.whl 2>/dev/null)" ]; then
            echo "::error::no Android wheels at $WHEELS; the wheels job should have built them"
            exit 1
          fi
          ls "$WHEELS"
          # The cross-built wheels are pinned by hash in a generated file, because their
          # bytes differ per build and cannot be committed (m14-part9.md). This job is a
          # fresh checkout, so it writes its own from the wheels it actually has.
          python3 tools/lock-python.py --refresh-local --wheel-dir "$WHEELS"
          [ -n "${GITHUB_ENV:-}" ] && echo "BCA_WHEEL_DIR=$WHEELS" >> "$GITHUB_ENV"
          true

      - name: Assemble debug, both editions
        run: >-
          ./gradlew :app:assemblePlayDebug :app:assembleExpertDebug
          -Pbeancount.wheelDir="$BCA_WHEEL_DIR"

      - name: minSdk symbol gate
        # Fails if any bundled .so needs a symbol newer than minSdk — the failure mode
        # that only shows up on old devices (docs/feasibility/r1-minsdk28.md).
        run: |
          APK=$(find app/build/outputs/apk -name '*play-arm64-v8a-debug*.apk' | head -1)
          python3 tools/check-minsdk-symbols.py "$APK" --api 28 --abi arm64-v8a

      - name: The licence notices match what the APK ships
        # licences.json is generated from a built APK and committed, so it can drift — and a
        # drifted licence file is not untidiness, it is a component shipping with no notice
        # a user can read (docs/milestones/m14-part15.md).
        run: |
          APK=$(find app/build/outputs/apk -name '*expert-arm64-v8a-debug*.apk' | head -1)
          python3 tools/licences.py --apk "$APK" --check

      - name: No build-machine paths in the APK
        run: |
          APK=$(find app/build/outputs/apk -name '*expert-arm64-v8a-debug*.apk' | head -1)
          python3 tools/check-build-paths.py "$APK"

      - name: Android Lint
        # Lives here, not in the jvm job: lint builds the app's assets, which means it needs
        # the cross-built wheels. In the jvm job it would have failed on a real runner for
        # exactly the reason N16 describes (docs/milestones/m14-part9.md).
        run: >-
          ./gradlew :app:lintPlayDebug :app:lintExpertDebug
          -Pbeancount.wheelDir="$BCA_WHEEL_DIR"
