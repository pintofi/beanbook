name: verify

# The M1 gate. Every check here must pass before a change lands.
# Instrumentation, corpus and accessibility gates are added by the milestones that
# introduce them (PLAN.md, "Test strategy") — this file grows with the app rather than
# listing jobs that do not exist yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Kotlin unit tests + boundary gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13 for Chaquopy's pip
        # Chaquopy needs a host interpreter matching the embedded runtime's minor version
        # (Phase 0 finding).
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core-domain:test :core-engine:test

      - name: Play flavor boundaries
        run: ./gradlew :app:verifyPlayFlavorBoundaries

      - name: Android Lint
        run: ./gradlew :app:lintPlayDebug :app:lintExpertDebug

  secrets:
    name: Secret and TLS-bypass scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No trustAll TLS anywhere in the repository
        # CLAUDE.md, non-negotiable: certificate errors are fatal and no trustAll code may
        # exist in this repository.
        run: |
          if grep -rnE 'trustAll|TrustAllCerts|ALLOW_ALL_HOSTNAME|checkServerTrusted\s*\([^)]*\)\s*\{\s*\}' \
              --include='*.kt' --include='*.java' --include='*.py' . ; then
            echo "::error::TLS verification bypass found"
            exit 1
          fi
          echo "no TLS bypass found"

      - name: No escaped string templates in user-facing text
        # "${'$'}{value}" prints the template literally instead of interpolating it. It has
        # shipped twice in this app — a key banner and three save messages — and is invisible
        # until the exact state that renders it occurs (docs/milestones/m7.md, m8.md).
        run: |
          if git grep -nF -- "\${'\$'}" -- '*.kt' ; then
            echo "::error::escaped string template found; it will print literally"
            exit 1
          fi
          echo "no escaped string templates"

      - name: No hard-coded signing keys
        run: |
          if git ls-files | grep -E '\.(pem|jks|keystore|p12|der)$'; then
            echo "::error::key material committed to the repository"
            exit 1
          fi
          # The contribution-key signing key lives in the private issuance repo and must
          # never be pasted into a source file here (docs/distribution.md 4.6).
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY' -- . ; then
            echo "::error::a private key is embedded in a tracked file"
            exit 1
          fi
          echo "no key material committed"

  build:
    name: Build both editions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch prebuilt Android wheels
        # beancount and watchfiles have no upstream Android wheels; they are cross-built
        # with cibuildwheel (tools/build-wheels.sh) and published as a release artifact.
        run: echo "TODO(M13): download pinned wheels; local builds use -Pbeancount.wheelDir"

      - name: Assemble debug, both editions
        run: ./gradlew :app:assemblePlayDebug :app:assembleExpertDebug

      - name: minSdk symbol gate
        # Fails if any bundled .so needs a symbol newer than minSdk — the failure mode
        # that only shows up on old devices (docs/feasibility/r1-minsdk28.md).
        run: |
          APK=$(find app/build/outputs/apk -name '*play-arm64-v8a-debug*.apk' | head -1)
          python3 tools/check-minsdk-symbols.py "$APK" --api 28 --abi arm64-v8a
