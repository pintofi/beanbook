name: verify

# The gate. Every check here must pass before a change lands. Instrumentation tests need an
# emulator and are run by hand; this file lists only what runs on a plain runner.

on:
  # Callable so a release runs exactly the same gates as a push.
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository. A caller that needs more (the release) says so itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Kotlin unit tests + boundary gate
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13 for Chaquopy's pip
        # Chaquopy needs a host interpreter matching the embedded runtime's minor version.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The default, 'enhanced', is a proprietary component under Gradle's own terms of
          # use. 'basic' is the open-source cache built on actions/cache.
          cache-provider: basic

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-wheels
          path: wheels

      - name: Pin the cross-built wheels
        # Gradle configures the embedded-engine module in every task, and that needs the
        # generated lock for the two wheels built in the wheels job.
        run: |
          WHEELS="$GITHUB_WORKSPACE/wheels"
          python3 tools/lock-python.py --refresh-local --wheel-dir "$WHEELS"
          echo "BCA_WHEEL_DIR=$WHEELS" >> "$GITHUB_ENV"

      - name: Unit tests
        # Every module with tests.
        run: >-
          ./gradlew :core-domain:test :core-data:test :core-engine:test :app:testPlayDebugUnitTest
          :engine-remote:test -Pbeancount.wheelDir="$BCA_WHEEL_DIR"

      - name: Reproducible Python bytecode
        # Hash-based .pyc rather than timestamp-based, so two builds of the same commit are
        # byte-identical. Derived from the commit, so a different commit is still allowed to
        # differ.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: detekt
        # Static analysis across every module. It earned its place on the first run: an
        # accessibility helper that was never wired up, so every amount was announced as raw
        # text.
        run: ./gradlew detekt -Pbeancount.wheelDir="$BCA_WHEEL_DIR"

      - name: Play flavor boundaries
        run: ./gradlew :app:verifyPlayFlavorBoundaries -Pbeancount.wheelDir="$BCA_WHEEL_DIR"

  python:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: The writer, the engine gate, the ledger reader and the plugin runner
        # The tests of engine-local/src/main/python, which holds the logic that computes what
        # gets written to a ledger. They need Beancount at the version the app ships and
        # nothing else.
        run: |
          pip install --quiet "beancount==3.2.3"
          python -m unittest discover -s engine-local/src/test/python

  workflows:
    name: Workflows are valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every workflow parses and has runnable jobs
        # This file was once malformed and GitHub never loaded it, so none of its gates ran.
        # A gate that has never executed is not a gate.
        run: |
          pip install --quiet pyyaml
          python3 tools/check-workflows.py

      - name: The versions written in the README, site and docs are the ones the app uses
        # Typed by hand, so they go stale when a dependency moves. See tools/check-versions.py.
        # fontTools and brotli draw the README badges again to compare them (tools/badges.py); they
        # are only used here, to read the website's Roboto files.
        run: |
          pip install --quiet "fonttools==4.67.0" "brotli==1.2.0"
          python3 tools/check-versions.py --require-badges

      - name: Every CHANGELOG heading links somewhere
        # A heading like [1.0.1] is only a link if a definition at the bottom of the file says
        # where. This also runs on a release tag, so a release cannot go out with a heading that
        # points to nothing. Fix with: tools/changelog-links.py
        run: python3 tools/changelog-links.py --check

  secrets:
    name: Secret and TLS-bypass scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No trustAll TLS anywhere in the repository
        # Non-negotiable: certificate errors are fatal and no trustAll code may exist in this
        # repository.
        run: |
          if grep -arnE 'trustAll|TrustAllCerts|ALLOW_ALL_HOSTNAME|checkServerTrusted\s*\([^)]*\)\s*\{\s*\}' \
              --include='*.kt' --include='*.java' --include='*.py' . ; then
            echo "::error::TLS verification bypass found"
            exit 1
          fi
          echo "no TLS bypass found"

      - name: No source file contains a NUL byte
        # GNU grep treats a file containing a NUL as binary and reports nothing for it, so a
        # single stray NUL makes a source file invisible to every grep-based gate above --
        # including the trustAll scan, which is release-blocking.
        #
        # Not hypothetical: RemoteState.kt, which handles remote credentials and TLS, carried a
        # literal NUL because `fill('\u0000')` was written with the character rather than the
        # escape. It compiled, it behaved correctly, and it was invisible to grep the whole
        # time. The escape is identical at runtime, so no source file needs the raw byte.
        #
        # Written in Python because a shell pattern cannot contain a NUL: bash truncates
        # $'\x00' to the empty string, which matches every line of every file. A guard written
        # that way fires on everything, which reads as "working" only until you look.
        run: |
          python3 - <<'EOF'
          import subprocess, sys
          files = subprocess.run(
              ["git", "ls-files", "-z", "--", "*.kt", "*.java", "*.py", "*.xml", "*.kts",
               "*.pro", "*.aidl", "*.md", "*.yml", "*.toml"],
              capture_output=True, check=True,
          ).stdout.split(b"\0")
          bad = [f.decode() for f in files if f and b"\0" in open(f, "rb").read()]
          for f in bad:
              print(f"::error file={f}::contains a NUL byte, which hides it from every "
                    f"grep-based gate in this workflow")
          sys.exit(1 if bad else 0)
          EOF
          echo "no NUL bytes in tracked source"

      - name: No silent downgrade from https to cleartext
        # Cleartext is allowed in remote mode, but only when the user typed http:// in full.
        # A scheme rewrite anywhere in the transport or client would turn "https" into a
        # suggestion, and it would look like ordinary string handling in review
        # (docs/threat-model.md, section 3.5).
        run: |
          if grep -arnE '"https".*(replace|removePrefix).*"http"|replace\(\s*"https"|"http://" *\+ *(host|origin|address)' \
              --include='*.kt' engine-remote/src/main app/src/main ; then
            echo "::error::something rewrites an https address into a cleartext one"
            exit 1
          fi
          echo "no scheme downgrade found"

      - name: No way past a certificate error in the WebView
        # onReceivedSslError must cancel, never proceed. A single proceed() call there is a
        # working "accept anyway" button, and it looks like ordinary error handling in review.
        run: |
          if grep -arn -A20 'onReceivedSslError' --include='*.kt' . | grep -E 'handler\.proceed|\bproceed\(\)' ; then
            echo "::error::an SSL error handler proceeds past a bad certificate"
            exit 1
          fi
          echo "no SSL error is proceeded past"

      - name: No escaped string templates in user-facing text
        # "${'$'}{value}" prints the template literally instead of interpolating it. It has
        # shipped twice in this app and is invisible until the exact state that renders it
        # occurs.
        run: |
          if git grep -nF -- "\${'\$'}" -- '*.kt' ; then
            echo "::error::escaped string template found; it will print literally"
            exit 1
          fi
          echo "no escaped string templates"

      - name: Every Python pin carries a hash
        # pip enforces this during the build, but only for the packages it reaches. A pin
        # that loses its hash lines in a hand-edit would quietly leave --require-hashes
        # mode for the whole file, and nothing would say so.
        run: |
          python3 - <<'CHECK'
          import re, sys
          text = open("engine-local/requirements.lock").read()
          pins = re.findall(r"^([A-Za-z0-9_.\-]+)==(\S+?)( \\)?$", text, re.M)
          bare = [n for n, _, cont in pins if not cont]
          if bare:
              print("::error::pins with no hash:", ", ".join(bare)); sys.exit(1)
          print(f"{len(pins)} pins, all hashed, {text.count('--hash=sha256:')} digests")
          CHECK

      - name: The licence is present and is GPL-2.0-only
        # The repository once declared itself GPL-2.0-only and shipped no licence text at all.
        # GPLv3 is named here because Beancount is explicitly "not or later": a v3 text would not be
        # a formatting slip, it would be a licence this project cannot use.
        run: |
          if [ ! -s COPYING ]; then
            echo "::error::COPYING is missing; the app claims to be GPL-2.0-only"
            exit 1
          fi
          if ! grep -q "Version 2, June 1991" COPYING; then
            echo "::error::COPYING is not the GPL version 2 text"
            exit 1
          fi
          if grep -qE "Version 3, 29 June 2007|GNU GENERAL PUBLIC LICENSE.*Version 3" COPYING; then
            echo "::error::COPYING is GPLv3; Beancount is GPL-2.0-only, explicitly not or-later"
            exit 1
          fi
          echo "COPYING is the GPL version 2 text"

      - name: No hard-coded signing keys
        run: |
          if git ls-files | grep -E '\.(pem|jks|keystore|p12|der)$'; then
            echo "::error::key material committed to the repository"
            exit 1
          fi
          # No private key may be pasted into a source file here.
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY' -- . ; then
            echo "::error::a private key is embedded in a tracked file"
            exit 1
          fi
          echo "no key material committed"

  wheels:
    name: Cross-build the Android wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Cache the built wheels
        # Keyed on what determines their content: the sdist pins, the backend pins and the
        # build script. Change any of the three and they are rebuilt; change nothing and a
        # runner spends no time on the NDK download.
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wheels
          key: android-wheels-${{ hashFiles('engine-local/wheels.lock', 'engine-local/build-backends.lock', 'tools/build-wheels.sh') }}

      - name: Android SDK command-line tools
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # The action's default also installs the legacy "tools" package, which the SDK
          # manager no longer offers; cibuildwheel installs the NDK itself.
          packages: ''

      - name: Rust with the Android targets
        if: steps.cache.outputs.cache-hit != 'true'
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build-wheels.sh --out wheels

      - name: No build-machine paths in the wheels
        # Earlier wheels carried the build machine's home directory in 25 strings, from Rust
        # panic metadata and maturin's SBOM.
        run: python3 tools/check-build-paths.py wheels/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-wheels
          path: wheels/*.whl
          retention-days: 7

  reproducible:
    name: Two builds of the same commit are identical
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The default, 'enhanced', is a proprietary component under Gradle's own terms of
          # use. 'basic' is the open-source cache built on actions/cache.
          cache-provider: basic
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-wheels
          path: wheels

      - name: Prepare
        run: |
          WHEELS="$GITHUB_WORKSPACE/wheels"
          python3 tools/lock-python.py --refresh-local --wheel-dir "$WHEELS"
          echo "BCA_WHEEL_DIR=$WHEELS" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build twice and compare
        # Builds must be reproducible. Two clean builds of the same commit once differed in 840
        # .pyc files, each carrying its source's mtime; with SOURCE_DATE_EPOCH set, CPython
        # emits hash-based .pyc and the APKs are byte-identical. This builds twice rather than
        # trusting that.
        run: |
          set -eu
          build() {
            rm -rf engine-local/build app/build/outputs/apk
            ./gradlew :app:assembleExpertDebug -Pbeancount.wheelDir="$BCA_WHEEL_DIR" --quiet
            cp app/build/outputs/apk/expert/debug/app-expert-arm64-v8a-debug.apk "$1"
          }
          build "$RUNNER_TEMP/a.apk"
          build "$RUNNER_TEMP/b.apk"
          python3 tools/check-reproducible.py "$RUNNER_TEMP/a.apk" "$RUNNER_TEMP/b.apk"

  build:
    name: Build both editions
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The default, 'enhanced', is a proprietary component under Gradle's own terms of
          # use. 'basic' is the open-source cache built on actions/cache.
          cache-provider: basic

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-wheels
          path: wheels

      - name: Reproducible Python bytecode
        # Hash-based .pyc rather than timestamp-based, so two builds of the same commit are
        # byte-identical. Derived from the commit, so a different commit is still allowed to
        # differ.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Check the wheels are here
        # Fails here with a clear message rather than two steps later with a confusing one.
        # beancount and watchfiles have no upstream Android wheels: without them nothing
        # assembles.
        run: |
          WHEELS="${BCA_WHEEL_DIR:-${GITHUB_WORKSPACE:-$PWD}/wheels}"
          if [ -z "$(ls -A "$WHEELS"/*.whl 2>/dev/null)" ]; then
            echo "::error::no Android wheels at $WHEELS; the wheels job should have built them"
            exit 1
          fi
          ls "$WHEELS"
          # The cross-built wheels are pinned by hash in a generated file, because their
          # bytes differ per build and cannot be committed. This job is a
          # fresh checkout, so it writes its own from the wheels it actually has.
          python3 tools/lock-python.py --refresh-local --wheel-dir "$WHEELS"
          [ -n "${GITHUB_ENV:-}" ] && echo "BCA_WHEEL_DIR=$WHEELS" >> "$GITHUB_ENV"
          true

      - name: Assemble debug, both editions
        run: >-
          ./gradlew :app:assemblePlayDebug :app:assembleExpertDebug
          -Pbeancount.wheelDir="$BCA_WHEEL_DIR"

      - name: minSdk symbol gate
        # Fails if any bundled .so needs a symbol newer than minSdk — the failure mode
        # that only shows up on old devices.
        run: |
          APK=$(find app/build/outputs/apk -name '*play-arm64-v8a-debug*.apk' | head -1)
          python3 tools/check-minsdk-symbols.py "$APK" --api 29 --abi arm64-v8a

      - name: The licence notices match what the APK ships
        # licences.json is generated from a built APK and committed, so it can drift — and a
        # drifted licence file is not untidiness, it is a component shipping with no notice
        # a user can read.
        run: |
          APK=$(find app/build/outputs/apk -name '*expert-arm64-v8a-debug*.apk' | head -1)
          python3 tools/licences.py --apk "$APK" --check

      - name: No build-machine paths in the APK
        run: |
          APK=$(find app/build/outputs/apk -name '*expert-arm64-v8a-debug*.apk' | head -1)
          python3 tools/check-build-paths.py "$APK"

      - name: Android Lint
        # Lives here, not in the jvm job: lint builds the app's assets, which means it needs
        # the cross-built wheels. In the jvm job it would have failed on a real runner for
        # exactly that reason.
        run: >-
          ./gradlew :app:lintPlayDebug :app:lintExpertDebug
          -Pbeancount.wheelDir="$BCA_WHEEL_DIR"
