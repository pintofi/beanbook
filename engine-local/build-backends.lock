# PEP 517 build backends for the two cross-built wheels.
#
# cibuildwheel is pinned in tools/build-wheels.sh, but the *backend* it invokes is
# resolved fresh from PyPI inside each build-isolation environment, so an unpinned
# build silently follows upstream. It did: maturin moved 1.14.1 -> 1.15.0 between the
# August spike build and a rebuild in M14, changing the wheel for no reason of ours
# (docs/milestones/m14-part8.md). The same class of drift as click 8.4.2 -> 8.5.0.
#
# pip honours PIP_CONSTRAINT inside build isolation, which is how these are enforced.
