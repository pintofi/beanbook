RepoType: git
Repo: https://github.com/pintofi/beanbook.git

# Reproducible-build verification: F-Droid builds from source, compares the result with the
# signed APK named in each build's `binary`, and if they match publishes ours, so updates stay
# signed with the project key. The versionName ("1.0.0-expert") differs from the tag and the
# release file name ("v1.0.0", "beanbook-1.0.0-arm64-v8a.apk"), so a top-level Binaries template
# with %v cannot name the file; each build states its URL.

# SHA-256 of the project's APK signing certificate (lowercase hex, no colons).
AllowedAPKSigningKeys: d7039d79b2afa3ffc81aeba7bc8dbf45a73b07b94f982ca913d65028b9b2ff55

# The Python layer needs beancount and watchfiles cross-built for Android; the build must run
# tools/build-wheels.sh first (pinned sdists and backends), then Gradle. Unproven on F-Droid's
# build server: this is the step most likely to need changes.
Builds:
  - versionName: 1.0.0-expert
    versionCode: 1
    commit: v1.0.0
    binary: https://github.com/pintofi/beanbook/releases/download/v1.0.0/beanbook-1.0.0-arm64-v8a.apk
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y python3.13 python3.13-venv
    init: ../tools/build-wheels.sh --out ../wheels
    gradle:
      - expert
    prebuild: sed -i 's#^beancount.wheelDir=.*#beancount.wheelDir=../wheels#' ../gradle.properties

AutoUpdateMode: None
UpdateCheckMode: Tags
CurrentVersion: 1.0.0-expert
CurrentVersionCode: 1
