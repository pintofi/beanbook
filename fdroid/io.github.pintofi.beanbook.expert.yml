MaintainerNotes: |
  Only the latest version is kept in the submitted metadata: its two entries replace the
  previous version's two, as the fdroiddata maintainers ask.

  One APK per processor type, each its own version code: the release number times
  ten, plus 1 for arm64-v8a and 2 for x86_64 (the universal APK, code +0, is only on GitHub
  and is not built here). versionCode in app/build.gradle.kts is the release number, so
  VercodeOperation turns it into the two codes, and the Builds entries must stay in ascending
  code order because AutoUpdateMode copies the last entries.

  Each build pulls its APK from the GitHub release with binary:, so the release must be
  published before a build can verify. The cross-built wheels (beancount, watchfiles) come
  from tools/build-wheels.sh in init:, at its fixed work folder /tmp/bca-wheels; the build
  records that path, so the folder must not change. The release workflow and this recipe are
  described in docs/fdroid.md and CONTRIBUTING.md in the source repository.

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - 10 * %c + 1
  - 10 * %c + 2
CurrentVersion: 1.0.2
