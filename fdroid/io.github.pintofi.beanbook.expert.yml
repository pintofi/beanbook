Repo: https://github.com/pintofi/beanbook.git
Binaries: 
  https://github.com/pintofi/beanbook/releases/download/v%v/beanbook-%v-universal.apk

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: fcfdc5de9fbba1702fb3c179160c1ea619e0a2b5
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y python3.13 python3.13-venv rustup m4 gcc libc6-dev
    init: ../tools/build-wheels.sh --out ../wheels
    gradle:
      - expert
    output: build/outputs/apk/expert/release/*universal*.apk
    prebuild: echo "beancount.wheelDir=$(realpath ../wheels)" >> ../gradle.properties
    ndk: r27d

